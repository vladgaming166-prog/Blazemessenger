org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 enables a new DSL by default. Keep the stable application DSL so
# Hilt, KSP, and the Google Services plugin configure the module reliably.
android.newDsl=false
android.builtInKotlin=true
android.disallowKotlinSourceSets=false
